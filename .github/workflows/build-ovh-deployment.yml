name: Build OVH PHP 8.2 deployment ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - release/ovh-deployment-clean
    paths:
      - .github/workflows/build-ovh-deployment.yml
    # Keep this push trigger restricted to workflow maintenance commits; verify scan diagnostics, prompt settings, local Tailwind build, and clean package. (2026-10-10 dashboard report, list filters, and scan-based missions)

permissions:
  contents: read

jobs:
  package:
    name: Build clean OVH package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v5

      - name: Assemble deployment files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist package
          mkdir -p dist package/data
          cp -a index.php .htaccess api OVH-INSTALLATION-GUIDE.md package/
          cp data/.htaccess package/data/.htaccess

          # Compile the Tailwind utility classes locally for production (no CDN/runtime warning).
          npm exec --yes --package=tailwindcss@3.4.17 -- tailwindcss -c tailwind.config.cjs -i api/assets/css/tailwind-input.css -o package/api/assets/css/tailwind-compiled.css --minify
          test -s package/api/assets/css/tailwind-compiled.css

          # Never ship live settings, users, leads, scans, audit history or credentials.
          find package/data -type f -name '*.json' -delete
          if [ -d package/api/data ]; then
            find package/api/data -maxdepth 1 -type f -name '*.json' -delete
          fi
          find package -type f -name '.env' -delete

          test -f package/index.php
          test -f package/api/index.php
          test -f package/api/login.php
          test -f package/api/admin/index.php
          test -f package/api/config/config.php
          test -f package/api/assets/css/tailwind-compiled.css
          if grep -R -n "cdn.tailwindcss.com" package/api; then
            echo "Production package still references the Tailwind CDN."
            exit 1
          fi
          test -f package/data/.htaccess
          if find package -type f \( -name '.env' -o -path '*/backups/*' -o -name '*.sql.gz' \) | grep -q .; then
            echo "Unexpected secret or backup file in deployment package."
            exit 1
          fi
          cd package
          zip -qr ../dist/greenhumble-ovh-php82.zip .

      - name: Publish deployment ZIP
        uses: actions/upload-artifact@v4
        with:
          name: greenhumble-ovh-php82
          path: dist/greenhumble-ovh-php82.zip
          if-no-files-found: error
          retention-days: 14
