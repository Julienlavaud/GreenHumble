name: Tests PHP — moteur commercial

on:
  pull_request:
    branches: [Quality-GPT]
  push:
    branches: [feat/tpe-commercial-engine-v0-1]

jobs:
  commercial-engine-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer PHP depuis Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-mbstring
          php --version
      - name: Vérifier la syntaxe
        run: |
          php -l api/includes/commercial_engine.php
          php -l api/includes/commercial_dossier.php
          php -l api/includes/commercial_adapter.php
          php -l api/includes/audit_response.php
          php -l api/includes/green_claims_rules.php
          php -l api/includes/collaborator_auth.php
          php -l api/audit.php
          php -l api/index.php
          php -l api/public_lead.php
          php -l api/admin/index.php
          php -l api/admin/save_state.php
          php -l api/login.php
          php -l api/collaborateur/index.php
          php -l tests/commercial_engine_test.php
          php -l tests/commercial_dossier_test.php
          php -l tests/commercial_adapter_test.php
          php -l tests/audit_response_test.php
          php -l tests/green_claims_rules_test.php
          php -l tests/collaborator_auth_test.php
          php -l tests/public_scan_contract_test.php
      - name: Tester la qualification commerciale
        run: php tests/commercial_engine_test.php
      - name: Tester les dossiers commerciaux
        run: php tests/commercial_dossier_test.php
      - name: Tester l’adaptateur d’intégration sécurisé
        run: php tests/commercial_adapter_test.php
      - name: Tester la validation des réponses d’audit
        run: php tests/audit_response_test.php
      - name: Tester le dictionnaire de pré-détection Green Claims
        run: php tests/green_claims_rules_test.php

      - name: Tester la vérification des mots de passe collaborateurs
        run: php tests/collaborator_auth_test.php

      - name: Tester le contrat du scan public et les contrôles d’accès
        run: php tests/public_scan_contract_test.php
