name: Qualité PHP

on:
  pull_request:
  push:
    branches:
      - Quality-GPT
      - feat/tpe-commercial-engine-v0-1
      - release/ovh-deployment-clean

jobs:
  php-lint:
    name: Vérification syntaxique PHP 8.2
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5
      - name: Installer PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
      - name: Vérifier la syntaxe de tous les fichiers PHP suivis
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(git ls-files -z '*.php')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Aucun fichier PHP trouvé."
            exit 1
          fi
          failed=0
          for file in "${files[@]}"; do
            if ! output="$(php -l "$file" 2>&1)"; then
              echo "::error file=$file::$output"
              failed=1
            else
              echo "$output"
            fi
          done
          exit "$failed"

      - name: Tests unitaires, de régression et d’intégration hors ligne
        shell: bash
        run: |
          set -euo pipefail
          php tests/public_scan_contract_test.php
          php tests/ovh_security_contract_test.php
          php tests/auth_system_accounts_test.php
          php tests/collaborator_auth_test.php
          php tests/audit_response_test.php
          php tests/ai_engine_reference_test.php
          php tests/ai_contract_test.php
          php tests/ai_provider_test.php
          php tests/ui_buttons_contract_test.php
          php tests/admin_workspace_contract_test.php
          php tests/bulk_delete_endpoint_test.php
          php tests/recommended_missions_contract_test.php
          php tests/risk_scoring_test.php
          php tests/green_claims_rules_test.php
          php tests/commercial_engine_test.php
          php tests/commercial_adapter_test.php
          php tests/commercial_dossier_test.php
          php tests/audit_database_test.php
          php tests/install_schema_test.php
          php tests/list_import_export_test.php
          php tests/list_single_scan_status_test.php
          php tests/company_data_provenance_test.php
          php tests/scan_storage_integration_test.php
          php tests/cache_refresh_contract_test.php
          php tests/scanner_prompt_csv_contract_test.php
  mysql-integration:
    name: Intégration MySQL 8.0
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: greenhumble_test
          MYSQL_USER: greenhumble_test
          MYSQL_PASSWORD: greenhumble_test_password
          MYSQL_ROOT_PASSWORD: greenhumble_test_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5
      - name: Installer PHP 8.2 avec PDO MySQL
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql
          tools: none
      - name: Tester schéma, déduplication SIREN et stockage SQL
        env:
          GH_TEST_DB_HOST: 127.0.0.1
          GH_TEST_DB_NAME: greenhumble_test
          GH_TEST_DB_USER: greenhumble_test
          GH_TEST_DB_PASS: greenhumble_test_password
        run: php tests/mysql_audit_integration_test.php
